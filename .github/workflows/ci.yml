name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-e-teste:
    runs-on: ubuntu-latest
    # O contexto `secrets` nao pode ser usado no `if` dos passos; o booleano e
    # resolvido aqui (env do job) e consultado como env.HAS_DATABASE_URL.
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}

    steps:
      - name: Copia o codigo
        uses: actions/checkout@v4

      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instala as dependencias
        run: npm ci

      - name: Compila o frontend
        run: npm run build

      - name: Testes unitarios
        run: npm run test:unit

      # Os testes de API e o smoke usam o banco apontado por DATABASE_URL. Sem
      # esse secret no repositorio, os dois passos sao ignorados. O db:setup e
      # idempotente e garante que o branch de CI tenha as migrations aplicadas.
      - name: Testes de API
        if: env.HAS_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: test
        run: npm run db:setup && npm run test:api

      - name: Verificacao de ponta a ponta
        if: env.HAS_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: test
        run: npm run smoke
